name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Compile & lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tooling
        run: python -m pip install --upgrade pip pyflakes

      - name: Byte-compile (syntax check)
        run: python -m py_compile MakeMeLookBusy.py

      - name: Static analysis (pyflakes)
        run: python -m pyflakes MakeMeLookBusy.py
